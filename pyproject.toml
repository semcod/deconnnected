[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deconnected"
version = "0.6.2"
description = "Cross-layer dependency correlation and safe refactoring planner for applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "click>=8.1",
  "networkx>=3.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "rich>=13.7",
  "sqlglot>=25.0",
  "libcst>=1.4"
]

[project.optional-dependencies]
gui = ["playwright>=1.45"]
testql = ["testql>=1.2.60"]
analysis = ["tree-sitter>=0.22", "rapidfuzz>=3.9"]
ecosystem = [
  "testql>=1.2.60",
  "code2llm>=0.5.173",
  "redup>=0.4.30",
  "regix",
  "vallm",
  "toonic",
  "code2logic"
]
llm = ["litellm>=1.80"]
agent = ["litellm>=1.80"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10",
    "goal>=2.1.0",
    "costs>=0.1.53",
    "pfix>=0.1.60",
]

[project.scripts]
deconnected = "deconnected.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
